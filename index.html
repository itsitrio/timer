<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Countdown Clock - Configuration Wizard - SQRL Powered!</title>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="shortcut icon" href="/img/TimerPet.png">
    <link rel="apple-touch-icon" href="/img/TimerPet.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
    <form id="wizardForm">
        <div class="wrapper">
            <h1 class="pagetitle">Countdown Wizard</h1>

                <label for="title">Countdown Title:</label>
                <input type="text" id="title" name="title" placeholder="New Year Countdown">

            
                <label for="endDate">End Date:</label>
                <input type="datetime-local" id="endDate" name="endDate">
            
                <label for="timezone">Timezone:</label>
                <select id="timezone" name="timezone">
                    <option value="Local" selected>My local time</option>
                    <optgroup label="Common Timezones">
                        <option value="America/Los_Angeles">Pacific</option>
                        <option value="America/Phoenix">Arizona</option>
                        <option value="America/Denver">Mountain</option>
                        <option value="America/Chicago">Central</option>
                        <option value="America/New_York">Eastern</option>
                        <option value="UTC">UTC</option>
                    </optgroup>
                    <optgroup label="All Timezones" id="allTimezones"></optgroup>
                </select>
            
                <div class="button-container">
                    <input type="submit" value="Create Countdown">
                    <button type="button" id="toggleDisplaySettings" class="toggle-button" aria-label="Display options" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </button>
                </div>
            <div id="creditbar"><a href="https://itrio.pet">
                <p>Timer Pet v1.0.2 &ndash; Made by Itrio</p>
                <img class="sqrllogo-sm" src="./img/SQRLWhite@0.5x.png"></a>
            </div>
        </div>
        <div class="wrapper" id="displaySettings" style="display: none;">
            <h1 class="pagetitle">Display Options</h1>
            <label for="textColor">Text Color:</label>
            <select id="textColor" name="textColor">
                <option value="#ffa629">Gold</option>
                <option value="#ffffff">White</option>
                <option value="#ff6347">Tomato</option>
                <option value="#00ff00">Lime</option>
                <option value="#7000ff">Becki Purple</option>
                <option value="#003978">Lynix Blue</option>
            </select>
            <label for="showClocks">Show Clocks:</label>
            <select id="showClocks" name="showClocks">
                <option value="false">No</option>
                <option value="true">Yes</option>
            </select>
            <label for="orgCredit">Organization Credit:</label>
            <input type="text" id="orgCredit" name="orgCredit" placeholder="Anthrocon, BLFC, etc...">
        </div>

    </form>
    <script src="./js/index.js"></script>
</body>
</html>
